name: Ferventio
options:
  bundleIdPrefix: io.ferventio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  FerventioCore:
    path: Packages/FerventioCore

targets:
  Ferventio:
    type: application
    platform: iOS
    sources:
      - path: Ferventio
    resources:
      - path: Ferventio/Resources
    dependencies:
      - package: FerventioCore
        product: FerventioDomain
      - package: FerventioCore
        product: FerventioNetworking
      - package: FerventioCore
        product: FerventioPersistence
      - package: FerventioCore
        product: FerventioSupport
    info:
      path: Ferventio/Info.plist
      properties:
        CFBundleDisplayName: Ferventio
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Ferventio OAuth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        LSApplicationCategoryType: public.app-category.social-networking
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: Ferventio
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.0.1
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.ferventio.ios.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.ferventio.ios
    scheme:
      testTargets:
        - FerventioTests

  FerventioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FerventioTests
    dependencies:
      - target: Ferventio
      - package: FerventioCore
        product: FerventioDomain
      - package: FerventioCore
        product: FerventioNetworking
      - package: FerventioCore
        product: FerventioPersistence
      - package: FerventioCore
        product: FerventioSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ferventio.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
