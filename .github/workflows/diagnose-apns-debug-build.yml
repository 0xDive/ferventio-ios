name: Diagnose APNs Debug Build

on:
  push:
    branches:
      - feat/ios-apns
    paths:
      - .github/workflows/diagnose-apns-debug-build.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Debug with diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/apns-debug-build.log"
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG"
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            MATCHES="$RUNNER_TEMP/apns-debug-errors.log"
            grep -nE '(^|[[:space:]])error:|fatal error:|non-sendable|actor-isolated|sending .* risks|Command .* failed|EmitSwiftModule.*failed' "$LOG" \
              | tail -n 40 > "$MATCHES" || true
            if [[ ! -s "$MATCHES" ]]; then
              tail -n 40 "$LOG" > "$MATCHES"
            fi
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=APNs Debug compiler diagnostic::$line"
            done < "$MATCHES"
            exit "$STATUS"
          fi
