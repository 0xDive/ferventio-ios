name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test core packages
        run: swift test --package-path Packages/FerventioCore

      - name: Validate privacy manifest and entitlements
        run: |
          plutil -lint Ferventio/Resources/PrivacyInfo.xcprivacy
          plutil -lint Ferventio/Ferventio.entitlements
          /usr/bin/python3 - <<'PY'
          import plistlib
          from pathlib import Path

          manifest_path = Path("Ferventio/Resources/PrivacyInfo.xcprivacy")
          with manifest_path.open("rb") as handle:
              manifest = plistlib.load(handle)

          entries = manifest.get("NSPrivacyAccessedAPITypes", [])
          user_defaults = next(
              (
                  entry
                  for entry in entries
                  if entry.get("NSPrivacyAccessedAPIType")
                  == "NSPrivacyAccessedAPICategoryUserDefaults"
              ),
              None,
          )
          if user_defaults is None:
              raise SystemExit("UserDefaults privacy access category is missing")
          if "CA92.1" not in user_defaults.get("NSPrivacyAccessedAPITypeReasons", []):
              raise SystemExit("UserDefaults privacy reason CA92.1 is missing")
          PY

      - name: Validate app icon
        run: |
          set -euo pipefail
          ICON="Ferventio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          CONTENTS="Ferventio/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"

          test -f "$ICON"
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          contents_path = Path("Ferventio/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json")
          payload = json.loads(contents_path.read_text(encoding="utf-8"))
          images = payload.get("images", [])
          expected = {
              "filename": "AppIcon-1024.png",
              "idiom": "universal",
              "platform": "ios",
              "size": "1024x1024",
          }
          if expected not in images:
              raise SystemExit("AppIcon Contents.json does not declare the universal 1024px icon")
          PY

          width="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth:/ {print $2}')"
          height="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight:/ {print $2}')"
          alpha="$(sips -g hasAlpha "$ICON" | awk '/hasAlpha:/ {print $2}')"
          [[ "$width" == "1024" && "$height" == "1024" ]]
          [[ "$alpha" == "no" ]]

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate release build settings
        run: |
          set -euo pipefail
          SETTINGS="$(xcodebuild -project Ferventio.xcodeproj -scheme Ferventio -configuration Release -showBuildSettings)"
          grep -Fq "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" <<< "$SETTINGS"
          grep -Fq "MARKETING_VERSION = 0.1.0" <<< "$SETTINGS"
          grep -Fq "CURRENT_PROJECT_VERSION = 1" <<< "$SETTINGS"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = io.ferventio.ios" <<< "$SETTINGS"

      - name: Build application
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build release application
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned release archive
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${RUNNER_TEMP}/Ferventio.xcarchive"
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive

          APP_PATH="$ARCHIVE_PATH/Products/Applications/Ferventio.app"
          APP_PLIST="$APP_PATH/Info.plist"
          PRIVACY_MANIFEST="$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PLIST"
          test -f "$PRIVACY_MANIFEST"
          plutil -lint "$PRIVACY_MANIFEST"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$APP_PLIST")" == "0.1.0" ]]
          [[ "$(plutil -extract CFBundleVersion raw "$APP_PLIST")" == "1" ]]
          [[ "$(plutil -extract CFBundleIdentifier raw "$APP_PLIST")" == "io.ferventio.ios" ]]
          [[ "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$APP_PLIST")" == "io.ferventio.ios" ]]
          [[ "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP_PLIST")" == "false" ]]

      - name: Select iOS Simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys

          payload = json.load(sys.stdin)
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              marker = "SimRuntime.iOS-"
              if marker not in runtime:
                  continue
              version = tuple(
                  int(component)
                  for component in runtime.split(marker, 1)[1].split("-")
                  if component.isdigit()
              )
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable", True) and name.startswith("iPhone"):
                      candidates.append((version, "Pro" in name, name, device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone Simulator found")
          print(max(candidates)[3])
          ')"
          echo "IOS_SIMULATOR_ID=${IOS_SIMULATOR_ID}" >> "$GITHUB_ENV"
          echo "Using iOS Simulator ${IOS_SIMULATOR_ID}"

      - name: Build application tests
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            build-for-testing

      - name: Run application tests
        shell: bash
        run: |
          xcrun simctl boot "${IOS_SIMULATOR_ID}" || true
          xcrun simctl bootstatus "${IOS_SIMULATOR_ID}" -b

          RESULT_BUNDLE="${RUNNER_TEMP}/FerventioTests.xcresult"
          TEST_LOG="${RUNNER_TEMP}/FerventioTests.log"
          rm -rf "${RESULT_BUNDLE}"

          set +e
          set -o pipefail
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -resultBundlePath "${RESULT_BUNDLE}" \
            test-without-building 2>&1 | tee "${TEST_LOG}"
          TEST_STATUS="${PIPESTATUS[0]}"
          set -e

          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            TEST_RESULT_BUNDLE="${RESULT_BUNDLE}" TEST_LOG="${TEST_LOG}" /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          result_bundle = Path(os.environ["TEST_RESULT_BUNDLE"])
          test_log = Path(os.environ["TEST_LOG"])
          details = ""

          if result_bundle.exists():
              result = subprocess.run(
                  [
                      "xcrun",
                      "xcresulttool",
                      "get",
                      "test-results",
                      "summary",
                      "--path",
                      str(result_bundle),
                  ],
                  capture_output=True,
                  text=True,
              )
              if result.returncode == 0:
                  details = result.stdout.strip()

          if not details and test_log.exists():
              details = test_log.read_text(encoding="utf-8", errors="replace")[-6000:]

          if not details:
              details = "xcodebuild failed without readable xcresult or log output"

          details = details[-6000:]
          escaped = (
              details.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=iOS test failure::{escaped}")
          PY
            exit "${TEST_STATUS}"
          fi
