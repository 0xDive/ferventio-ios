name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test core packages
        run: swift test --package-path Packages/FerventioCore

      - name: Validate privacy manifest
        run: |
          plutil -lint Ferventio/Resources/PrivacyInfo.xcprivacy
          /usr/bin/python3 - <<'PY'
          import plistlib
          from pathlib import Path

          manifest_path = Path("Ferventio/Resources/PrivacyInfo.xcprivacy")
          with manifest_path.open("rb") as handle:
              manifest = plistlib.load(handle)

          entries = manifest.get("NSPrivacyAccessedAPITypes", [])
          user_defaults = next(
              (
                  entry
                  for entry in entries
                  if entry.get("NSPrivacyAccessedAPIType")
                  == "NSPrivacyAccessedAPICategoryUserDefaults"
              ),
              None,
          )
          if user_defaults is None:
              raise SystemExit("UserDefaults privacy access category is missing")
          if "CA92.1" not in user_defaults.get("NSPrivacyAccessedAPITypeReasons", []):
              raise SystemExit("UserDefaults privacy reason CA92.1 is missing")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build application
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build release application
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select iOS Simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys

          payload = json.load(sys.stdin)
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              marker = "SimRuntime.iOS-"
              if marker not in runtime:
                  continue
              version = tuple(
                  int(component)
                  for component in runtime.split(marker, 1)[1].split("-")
                  if component.isdigit()
              )
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable", True) and name.startswith("iPhone"):
                      candidates.append((version, "Pro" in name, name, device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone Simulator found")
          print(max(candidates)[3])
          ')"
          echo "IOS_SIMULATOR_ID=${IOS_SIMULATOR_ID}" >> "$GITHUB_ENV"
          echo "Using iOS Simulator ${IOS_SIMULATOR_ID}"

      - name: Build application tests
        run: |
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            build-for-testing

      - name: Run application tests
        shell: bash
        run: |
          xcrun simctl boot "${IOS_SIMULATOR_ID}" || true
          xcrun simctl bootstatus "${IOS_SIMULATOR_ID}" -b

          RESULT_BUNDLE="${RUNNER_TEMP}/FerventioTests.xcresult"
          TEST_LOG="${RUNNER_TEMP}/FerventioTests.log"
          rm -rf "${RESULT_BUNDLE}"

          set +e
          set -o pipefail
          xcodebuild \
            -project Ferventio.xcodeproj \
            -scheme Ferventio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -resultBundlePath "${RESULT_BUNDLE}" \
            test-without-building 2>&1 | tee "${TEST_LOG}"
          TEST_STATUS="${PIPESTATUS[0]}"
          set -e

          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            TEST_RESULT_BUNDLE="${RESULT_BUNDLE}" TEST_LOG="${TEST_LOG}" /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          result_bundle = Path(os.environ["TEST_RESULT_BUNDLE"])
          test_log = Path(os.environ["TEST_LOG"])
          details = ""

          if result_bundle.exists():
              result = subprocess.run(
                  [
                      "xcrun",
                      "xcresulttool",
                      "get",
                      "test-results",
                      "summary",
                      "--path",
                      str(result_bundle),
                  ],
                  capture_output=True,
                  text=True,
              )
              if result.returncode == 0:
                  details = result.stdout.strip()

          if not details and test_log.exists():
              details = test_log.read_text(encoding="utf-8", errors="replace")[-6000:]

          if not details:
              details = "xcodebuild failed without readable xcresult or log output"

          details = details[-6000:]
          escaped = (
              details.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=iOS test failure::{escaped}")
          PY
            exit "${TEST_STATUS}"
          fi
