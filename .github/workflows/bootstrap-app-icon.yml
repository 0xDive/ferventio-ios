name: Bootstrap App Icon

on:
  push:
    branches:
      - feat/ios-foundation
    paths:
      - .github/workflows/bootstrap-app-icon.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch exact Ferventio source icon
        run: |
          set -euo pipefail
          source_icon="$RUNNER_TEMP/ferventio-app-icon-source.png"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/0xDive/ferventio-android/main/app/src/main/ic_launcher-playstore.png \
            --output "$source_icon"

          actual_sha="$(git hash-object "$source_icon")"
          expected_sha="3bad51b02d255c3935edc646169f37b3ab8f2dc9"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Unexpected source icon blob: $actual_sha" >&2
            exit 1
          fi

      - name: Prepare 1024px opaque iOS icon
        run: |
          set -euo pipefail
          source_icon="$RUNNER_TEMP/ferventio-app-icon-source.png"
          destination="Ferventio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          mkdir -p "$(dirname "$destination")"

          cat > "$RUNNER_TEMP/prepare_app_icon.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO
          import UniformTypeIdentifiers

          guard CommandLine.arguments.count == 3 else { exit(64) }
          let sourceURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let destinationURL = URL(fileURLWithPath: CommandLine.arguments[2])

          guard
              let source = CGImageSourceCreateWithURL(sourceURL as CFURL, nil),
              let image = CGImageSourceCreateImageAtIndex(source, 0, nil),
              let colorSpace = CGColorSpace(name: CGColorSpace.sRGB),
              let context = CGContext(
                  data: nil,
                  width: 1024,
                  height: 1024,
                  bitsPerComponent: 8,
                  bytesPerRow: 0,
                  space: colorSpace,
                  bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue
              )
          else { exit(65) }

          context.interpolationQuality = .high
          context.draw(image, in: CGRect(x: 0, y: 0, width: 1024, height: 1024))
          guard let output = context.makeImage() else { exit(66) }
          guard let destination = CGImageDestinationCreateWithURL(
              destinationURL as CFURL,
              UTType.png.identifier as CFString,
              1,
              nil
          ) else { exit(67) }
          CGImageDestinationAddImage(destination, output, nil)
          guard CGImageDestinationFinalize(destination) else { exit(68) }
          SWIFT

          swift "$RUNNER_TEMP/prepare_app_icon.swift" "$source_icon" "$destination"

          width="$(sips -g pixelWidth "$destination" | awk '/pixelWidth:/ {print $2}')"
          height="$(sips -g pixelHeight "$destination" | awk '/pixelHeight:/ {print $2}')"
          alpha="$(sips -g hasAlpha "$destination" | awk '/hasAlpha:/ {print $2}')"
          [[ "$width" == "1024" && "$height" == "1024" ]]
          [[ "$alpha" == "no" ]]

      - name: Commit app icon
        run: |
          set -euo pipefail
          destination="Ferventio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          git add "$destination"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add app icon asset"
          git push origin HEAD:feat/ios-foundation
